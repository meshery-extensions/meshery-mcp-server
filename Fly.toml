app = "meshery-mcp-server-akash"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  MESHERY_MCP_TRANSPORT = "http"
  MESHERY_MCP_HTTP_ADDR = "0.0.0.0:8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
