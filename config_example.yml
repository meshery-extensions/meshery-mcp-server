# Example configuration for meshery-mcp-server.
#
# Usage:
#   cp config_example.yml config.local.yaml    # *.local.yaml is gitignored
#   meshery-mcp-server --config config.local.yaml
#
# Every setting is optional. Precedence, lowest to highest:
#   built-in defaults  <  this file  <  environment variables  <  flags
# Only the transport settings have flags.
#
# The Meshery token is never read from this file: set MESHERY_API_TOKEN in
# the environment (stdio only). A token in this file stops the server at
# startup.

meshery:
  # Meshery server to talk to.            Env: MESHERY_SERVER_URL
  # Inside a container, localhost is the container itself; use
  # http://host.docker.internal:9081 to reach Meshery on the host.
  url: http://localhost:9081

transport:
  # How MCP clients reach the server.     Flag: --transport  Env: MESHERY_MCP_TRANSPORT
  #   stdio  the AI app starts the server and talks over stdin/stdout
  #   http   Streamable HTTP at http://<host>:<port>/mcp, each client
  #          authorizing through MCP authorization (OAuth).
  mode: stdio

  # Settings for the stdio transport, ignored for http. stdio calls Meshery
  # as the user whose token is in MESHERY_API_TOKEN (env only). Without a
  # token, requests carry none, which only Meshery's Local provider accepts.
  stdio:
    # Meshery provider the token belongs to, as Meshery names it.
    # Defaults to Local without a token and to Meshery (cloud.meshery.io)
    # with one. A token with Local stops the server at startup: Local
    # ignores tokens.                     Env: MESHERY_PROVIDER
    # provider: Meshery

  # Settings for the http transport, ignored for stdio. Over http, each
  # client obtains its Meshery identity through OAuth; setting
  # MESHERY_API_TOKEN stops the server at startup.
  http:
    # Must be a loopback address (127.0.0.1, ::1, localhost).
    #                                     Flag: --host  Env: MESHERY_MCP_HOST
    host: 127.0.0.1
    #                                     Flag: --port  Env: MESHERY_MCP_PORT
    port: 8080

log:
  # One of: debug, info, warn, error.     Env: LOG_LEVEL
  level: info
  # text (development) or json (log collectors).   Env: LOG_FORMAT
  format: text
