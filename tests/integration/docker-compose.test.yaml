services:
  meshery-server-mock:
    image: layer5/meshery:stable-latest
    platform: linux/amd64
    ports:
      - "127.0.0.1:9081:9081"  
    environment:
      - PROVIDER_TOKEN=mock-integration-test-token
      - MESHERY_SERVER_MODE=development
    healthcheck:
      # Swapping curl out for wget to match what is present in the image
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9081/api/system/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
