- changed-files:
  - any-glob-to-any-file:
    - "internal/tools/**/*"
component/resources:
- changed-files:
  - any-glob-to-any-file:
    - "internal/resources/**/*"
component/prompts:
- changed-files:
  - any-glob-to-any-file:
    - "internal/prompts/**/*"
component/meshery-client:
- changed-files:
  - any-glob-to-any-file:
    - "internal/meshery/**/*"
component/config:
- changed-files:
  - any-glob-to-any-file:
    - "internal/config/**/*"
language/go:
- changed-files:
  - any-glob-to-any-file:
    - "**/*.go"
    - "go.mod"
