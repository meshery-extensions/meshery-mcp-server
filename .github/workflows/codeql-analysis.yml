name: "CodeQL"

on:
  push:
    branches: [ master ]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
  pull_request:
    branches: [ master ]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
  schedule:
    - cron: '26 22 * * 6'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    if: github.repository == 'meshery-extensions/meshery-mcp-server'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # Skip analysis until the repository contains Go code.
    - name: Check for Go module
      id: gate
      run: |
        if [ -f go.mod ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; echo "No go.mod found; skipping CodeQL analysis."; fi

    - name: Initialize CodeQL
      if: steps.gate.outputs.go == 'true'
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      if: steps.gate.outputs.go == 'true'
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      if: steps.gate.outputs.go == 'true'
      uses: github/codeql-action/analyze@v4
