name: Release

# Publishes a release when a version tag is pushed.
#
# Release flow:
#   1. As PRs merge to master, workflows/release-drafter.yml keeps a draft release
#      named "Meshery MCP Server vX.Y.Z" up to date. The version is resolved from
#      PR labels (see version-resolver in .github/release-drafter.yml).
#   2. A maintainer pushes the tag shown on that draft, e.g. `git tag v0.1.0 && git push upstream v0.1.0`.
#   3. This workflow runs GoReleaser, which attaches the binaries to the existing
#      draft (release.use_existing_draft in .github/.goreleaser.yml) and publishes it.
#
# The tag must match the draft's version; otherwise GoReleaser creates a separate release.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    if: github.repository == 'meshery-extensions/meshery-mcp-server'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean -f .github/.goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
