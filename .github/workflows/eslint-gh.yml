name: eslint-check
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
jobs:
  eslint:
    name: runner / eslint
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Run ESLint Meshery-UI
      run: |
        if [ -d "ui" ]; then
          cd ui && npm i eslint && npx eslint .
        else
          echo "No ui directory present, skipping ESLint for Meshery-UI."
        fi
    - name: Run ESLint Provider-UI
      run: |
        if [ -d "provider-ui" ]; then
          cd provider-ui && npm i eslint && npx eslint .
        else
          echo "No provider-ui directory present, skipping ESLint for Provider-UI."
        fi
