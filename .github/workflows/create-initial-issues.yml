          labels: "kind/documentation,help wanted,good first issue"
          body: |
            ## Current Behavior

            The repository README contains only the organization-level overview. There is no documentation specific to the `meshery-mcp-server` — no installation guide, configuration reference, or AI client integration instructions.

            ## Desired Behavior

            Comprehensive documentation that enables a new user to go from zero to a working Meshery MCP integration in under 10 minutes.

            ## Implementation

            ### README.md (overhaul)
            - Project overview: what the Meshery MCP Server is and why it matters
            - Architecture diagram showing MCP Server ↔ Meshery ↔ Kubernetes
            - Quick-start: install → configure → connect to Claude Desktop
            - Links to full docs and community

            ### docs/ directory
            Create the following documents:

            **`docs/installation.md`**
            - Install via `go install`, pre-built binaries, Docker, or Homebrew tap
            - Verify installation: `meshery-mcp-server --version`

            **`docs/configuration.md`**
            - Full config file schema with annotated examples
            - All environment variables (`MESHERY_SERVER_URL`, `MESHERY_API_TOKEN`, etc.)
            - Multi-instance / multi-context setup

            **`docs/tools-reference.md`**
            - Auto-generated or manually maintained table of all MCP tools with inputs, outputs, and examples

            **`docs/integrations/`**
            - `claude-desktop.md` — `claude_desktop_config.json` snippet and walkthrough
            - `vscode-copilot.md` — VS Code `settings.json` MCP config snippet
            - `cursor.md` — Cursor MCP config snippet
            - `cline.md` — Cline extension config snippet

            **`docs/development.md`**
            - How to build, test, and run locally
            - How to add a new MCP tool / resource / prompt
            - PR and contribution guidelines specific to this repo

            ## Acceptance Tests

            - A user following `docs/integrations/claude-desktop.md` can connect Claude Desktop to a local Meshery instance
            - `docs/tools-reference.md` lists every tool registered in the server
            - All code snippets in docs are tested and correct
            - README passes a Markdown linter with zero errors

