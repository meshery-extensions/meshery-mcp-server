name: Meshery MCP Server Build And Test
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - "master"
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  push:
    branches:
      - "master"
    paths-ignore:
      - "**/*.md"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup golint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: Build
        run: make build

      - name: Test
        run: make test