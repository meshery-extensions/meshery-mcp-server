# Release notes are drafted here and published by GoReleaser (see workflows/release.yml).
# The draft's name must match GoReleaser's `release.name_template` so GoReleaser can
# attach binaries to this draft instead of creating a second release.
name-template: 'Meshery MCP Server v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
# The next version is resolved from the labels of the PRs merged since the last release.
version-resolver:
  major:
    labels:
      - 'release/major'
  minor:
    labels:
      - 'kind/feature'
      - 'kind/enhancement'
  patch:
    labels:
      - 'kind/fix'
      - 'kind/bugfix'
      - 'kind/bug'
      - 'kind/chore'
  default: patch
categories:
  - title: '🚀 Features'
    labels:
      - 'kind/feature'
      - 'kind/enhancement'
  - title: '🛠 MCP Tools, Resources, Prompts'
    labels:
      - 'component/tools'
      - 'component/resources'
      - 'component/prompts'
  - title: '🔌 Meshery Client'
    labels:
      - 'component/meshery-client'
  - title: '🐛 Bug Fixes'
    labels:
      - 'kind/fix'
      - 'kind/bugfix'
      - 'kind/bug'
  - title: '🧰 Maintenance'
    labels:
      - 'kind/chore'
      - 'area/ci'
      - 'area/tests'
  - title: 📖 Documentation
    label: area/docs
  - title: 🔒 Security
    label: security
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
template: |
  ## What's New
  ## 🔤 General
  $CHANGES

  ## 👨🏽‍💻 Contributors

  Thank you to our contributors for making this release possible:
  $CONTRIBUTORS
autolabeler:
  - label: 'area/docs'
    branch:
      - '/docs/'
  - label: 'area/ci'
    files:
      - '.github/**'
