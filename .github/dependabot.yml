version: 2
updates:
- package-ecosystem: gomod
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  labels:
  - pr/dependencies
  - kind/chore
  - language/go
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  labels:
  - pr/dependencies
  - kind/chore
  - area/ci
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  labels:
  - pr/dependencies
  - kind/chore
  - area/ci
