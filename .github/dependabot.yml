version: 2
updates:
- package-ecosystem: gomod
  directory: "/"
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  labels:
  - pr/dependencies
  - kind/chore
  - language/go

- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  labels:
  - pr/dependencies
  - kind/chore
