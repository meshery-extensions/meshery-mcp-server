project_name: meshery-mcp-server
version: 2
before:
  hooks:
    - go mod tidy
builds:
- id: meshery-mcp-server
  main: ./cmd/meshery-mcp-server
  binary: meshery-mcp-server
  env:
    - CGO_ENABLED=0
  ldflags:
    - -s -w -X main.version={{.Tag}} -X main.commit={{.ShortCommit}}
  goos:
    - darwin
    - linux
    - windows
  goarch:
    - amd64
    - arm64
  ignore:
    - goos: windows
      goarch: arm64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'

# TODO: add a `dockers` section publishing ghcr.io/meshery-extensions/meshery-mcp-server
# once a Dockerfile exists.

release:
  # Must match `name-template` in .github/release-drafter.yml. GoReleaser finds the
  # Release Drafter draft by this name, uploads the artifacts to it, keeps its notes
  # (default `mode: keep-existing`), and publishes it.
  name_template: "Meshery MCP Server {{.Tag}}"
  use_existing_draft: true
