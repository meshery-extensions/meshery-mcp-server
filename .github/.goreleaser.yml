project_name: meshery-mcp-server
version: 2
before:
  hooks:
    - go mod tidy
builds:
- id: meshery-mcp-server
  main: ./cmd/meshery-mcp-server
  binary: meshery-mcp-server
  env:
    - CGO_ENABLED=0
  ldflags:
    - -s -w -X main.version={{.Tag}} -X main.commit={{.ShortCommit}}
  goos:
    - darwin
    - linux
    - windows
  goarch:
    - amd64
    - arm64
  ignore:
    - goos: windows
      goarch: arm64

archives:
- id: default
  name_template: >-
    {{ .ProjectName }}_{{ .Version }}_
    {{- title .Os }}_
    {{- if eq .Arch "amd64" }}x86_64
    {{- else }}{{ .Arch }}{{ end }}
  formats: [tar.gz]
  format_overrides:
    - goos: windows
      formats: [zip]

checksum:
  name_template: 'checksums.txt'
sboms:
  - artifacts: archive
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'

dockers:
- id: meshery-mcp-server
  goos: linux
  goarch: amd64
  dockerfile: Dockerfile.release
  image_templates:
    - "ghcr.io/meshery-extensions/meshery-mcp-server:{{ .Tag }}"
    - "ghcr.io/meshery-extensions/meshery-mcp-server:latest"
  build_flag_templates:
    - "--pull"
    - "--label=org.opencontainers.image.created={{ .Timestamp }}"
    - "--label=org.opencontainers.image.version={{ .Tag }}"
    - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
    - "--label=org.opencontainers.image.title={{ .ProjectName }}"
docker_signs:
- artifacts: all

release:
  name_template: "Meshery MCP Server {{.Tag}}"
  use_existing_draft: true
