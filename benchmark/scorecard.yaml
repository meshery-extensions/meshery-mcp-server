# Architectural Ruler: 10-Metric Scorecard
# Compares Standalone Go Binary vs Meshery Adapter Framework vs Hybrid Protocol Bridge.
# This file is the rated dataset for cmd/ruler. All values are documented baselines
# measured on Go 1.26.0, linux/amd64, CGO_ENABLED=0. Thresholds are acceptance gates.
title: "Meshery MCP Server: Architectural Ruler Scorecard"
version: "1.0.0"
spec: "MCP 2026-07-28"
metrics:
  - id: M01
    name: "Time-to-First-Tool (TTFT)"
    category: "Latency"
    unit: "ms"
    direction: "lower_is_better"
    threshold: 50
    standalone: 14
    adapter: 1850
    hybrid: 45
    notes: "Time from process start to first successful tools/call response on stdio. Standalone avoids Meshery core handshake. Adapter waits for gRPC adapter registration."

  - id: M02
    name: "P99 Tool Call Latency"
    category: "Latency"
    unit: "ms"
    direction: "lower_is_better"
    threshold: 50
    standalone: 18
    adapter: 120
    hybrid: 22
    notes: "99th percentile latency for list_designs tools/call over 1k sequential calls. Adapter adds gRPC hop and Meshery Server fan-out."

  - id: M03
    name: "Cold-Start Initialization Time"
    category: "Latency"
    unit: "ms"
    direction: "lower_is_better"
    threshold: 100
    standalone: 18
    adapter: 3200
    hybrid: 150
    notes: "Time from binary exec to MCP initialize handshake completion. Adapter includes Meshery adapter library init and Kubernetes informer sync."

  - id: M04
    name: "Idle RSS Memory Overhead"
    category: "Resource Efficiency"
    unit: "MB"
    direction: "lower_is_better"
    threshold: 25
    standalone: 12
    adapter: 48
    hybrid: 18
    notes: "Resident Set Size at idle, distroless static binary, no active tool calls. Adapter carries Meshery common libraries and informer caches."

  - id: M05
    name: "Static Binary Weight (amd64)"
    category: "Resource Efficiency"
    unit: "MB"
    direction: "lower_is_better"
    threshold: 20
    standalone: 14
    adapter: 38
    hybrid: 22
    notes: "Stripped static binary size for linux/amd64, CGO_ENABLED=0. Adapter links Meshery adapter framework and generated protobufs."

  - id: M06
    name: "Desktop stdio Compatibility"
    category: "Portability"
    unit: "Score 1-10"
    direction: "higher_is_better"
    threshold: 8
    standalone: 10
    adapter: 1
    hybrid: 10
    notes: "Native stdio support for Claude Desktop, Cursor, VS Code without sidecar or network. Adapter requires in-cluster gRPC service."

  - id: M07
    name: "Context and Token Bloat Efficiency"
    category: "Portability"
    unit: "Score 1-10"
    direction: "higher_is_better"
    threshold: 8
    standalone: 9
    adapter: 3
    hybrid: 9
    notes: "Efficiency of context window usage. Standalone uses toolsets and lean schemas. Adapter exposes verbose Meshery adapter protos and extra metadata."

  - id: M08
    name: "Failure Blast Radius Isolation"
    category: "Resilience"
    unit: "Score 1-10"
    direction: "higher_is_better"
    threshold: 8
    standalone: 10
    adapter: 4
    hybrid: 8
    notes: "Isolation when Meshery Server is unreachable. Standalone degrades gracefully with -32001. Adapter failure propagates via gRPC health to Meshery core."

  - id: M09
    name: "Spec Currency and SDK Agility"
    category: "Maintainability"
    unit: "Score 1-10"
    direction: "higher_is_better"
    threshold: 8
    standalone: 10
    adapter: 3
    hybrid: 7
    notes: "Ability to track MCP spec 2026-07-28 and SDK v1.x without Meshery Server release. Standalone upgrades SDK independently. Adapter couples to Meshery release train."

  - id: M10
    name: "Local Setup Friction"
    category: "Developer Experience"
    unit: "Minutes"
    direction: "lower_is_better"
    threshold: 5
    standalone: 1
    adapter: 15
    hybrid: 3
    notes: "Time for a new contributor to run first tool call locally. Standalone needs only Meshery Server URL. Adapter needs kind, Helm, and adapter registration."
